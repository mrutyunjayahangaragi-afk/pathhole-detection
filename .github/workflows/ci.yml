name: CivicLens CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feature/**", "release/**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Schema Verification
        run: |
          python -c "from backend.db.init_schema import create_all_tables; create_all_tables('sqlite:///:memory:')"

      - name: Execute Pytest Suite
        env:
          ENV: testing
          DATABASE_PROVIDER: sqlite
          DATABASE_PATH: ":memory:"
          SECRET_KEY: test-secret-key-32-bytes-long-for-testing
        run: |
          pytest tests/ -v -k "not test_browser" --durations=10

  docker-build:
    name: Docker Container Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: civiclens:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
