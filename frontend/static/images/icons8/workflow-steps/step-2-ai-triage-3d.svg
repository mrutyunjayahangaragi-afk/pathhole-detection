      <circle cx="36" cy="46" r="5" fill="#ffffff"/>
      <circle cx="64" cy="46" r="5" fill="#ffffff"/>
      <circle cx="50" cy="64" r="5" fill="#ffffff"/>
      <!-- Multilingual Chip (ಕ) -->
      <rect x="64" y="60" width="22" height="18" rx="4" fill="#f59e0b"/>
