# CivicLens Production Render Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: civiclens
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py "backend.app:create_app()"
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_PROVIDER
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_CONTENT_LENGTH_MB
        value: "16"
      - key: NOMINATIM_USER_AGENT
        value: "CivicLens/1.0 (civic-triage-bengaluru)"
      - key: NOTIFICATION_PROVIDER_EMAIL
        value: console
      - key: NOTIFICATION_PROVIDER_SMS
        value: console
      - key: CORS_ORIGINS
        value: "*"
